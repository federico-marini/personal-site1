<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="420" height="440" role="img" aria-label="Architecture: Caller to Telephony to Voice/LLM Agent to Tools and API layer to Enterprise systems, with evaluation and monitoring">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ec4899"/>
    </marker>
    <style>
      .b { fill: none; stroke: #38bdf8; stroke-width: 2; }
      .t { fill: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 19px; text-anchor: middle; }
      .l { stroke: #38bdf8; stroke-width: 2; marker-end: url(#a); }
      .d { stroke: #ec4899; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#p); }
    </style>
  </defs>

  <rect class="b" x="110" y="16"  width="200" height="46" rx="10"/>
  <text class="t" x="210" y="45">Caller</text>
  <line class="l" x1="210" y1="62" x2="210" y2="86"/>

  <rect class="b" x="110" y="90"  width="200" height="46" rx="10"/>
  <text class="t" x="210" y="119">Telephony</text>
  <line class="l" x1="210" y1="136" x2="210" y2="160"/>

  <rect class="b" x="110" y="164" width="200" height="46" rx="10"/>
  <text class="t" x="210" y="193">Voice / LLM Agent</text>
  <line class="l" x1="210" y1="210" x2="210" y2="234"/>

  <rect class="b" x="110" y="238" width="200" height="46" rx="10"/>
  <text class="t" x="210" y="267">Tools / API Layer</text>
  <line class="l" x1="210" y1="284" x2="210" y2="308"/>

  <rect class="b" x="110" y="312" width="200" height="46" rx="10"/>
  <text class="t" x="210" y="341">Enterprise Systems</text>

  <rect class="b" x="60" y="382" width="300" height="46" rx="10" stroke="#ec4899"/>
  <text class="t" x="210" y="411" fill="#ec4899">Evaluation &amp; Monitoring</text>

  <path class="d" d="M110 187 H 60 V 378" fill="none"/>
  <path class="d" d="M310 261 H 380 V 378" fill="none"/>
</svg>
